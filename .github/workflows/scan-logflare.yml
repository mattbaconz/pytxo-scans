# Logflare's tests need Postgres, ClickHouse and Telegraf; this mirrors the
# services of its elixir-ci.yml test job.
name: scan-logflare
on:
  workflow_dispatch:
    inputs:
      prs:
        description: space-separated pull request numbers
        required: true
permissions: {}
jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: bitnamilegacy/postgresql:15
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logflare_test
          POSTGRESQL_WAL_LEVEL: logical
        options: >-
          --health-cmd "pg_isready -d logflare_test -U postgres -p 5432"
          --health-interval 10s --health-timeout 5s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:26.2
        ports: ["8123:8123", "9000:9000"]
        env:
          CLICKHOUSE_DB: logflare_test
          CLICKHOUSE_USER: logflare
          CLICKHOUSE_PASSWORD: logflare
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MIX_ENV: test
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Logflare/logflare
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Start Telegraf
        run: |
          mkdir -p db/telegraf_output
          touch db/telegraf_output/metrics.out
          chmod 666 db/telegraf_output/metrics.out
          docker compose up -d telegraf
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Rust
        run: rustup toolchain install "$(awk '$1=="rust"{print $2}' .tool-versions)" && rustup default "$(awk '$1=="rust"{print $2}' .tool-versions)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the pull requests
        env:
          PRS: ${{ inputs.prs }}
        run: for n in $PRS; do git fetch origin "pull/$n/head:agent/pr-$n"; done
      - uses: Pytxo-dev/pytxo/actions/land@v1.3.3
        with:
          inputs: agent/*
          base: origin/main
          # pytxo checks run in a fresh worktree; point its Telegraf output at the running container's.
          checks: "rm -rf db/telegraf_output && ln -s \"$GITHUB_WORKSPACE/db/telegraf_output\" db/telegraf_output && mix local.hex --force && mix local.rebar --force && mix deps.get && epmd -daemon && mix do ecto.create + ecto.migrate + test"
          per-input: "true"
      - name: Print the decision
        if: always()
        run: cat pytxo-land.md 2>/dev/null || echo "no pytxo-land.md"
